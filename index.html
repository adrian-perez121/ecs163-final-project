<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Project</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="./streamGraph/stream.css">
    <link rel="stylesheet" href="./pcp/pcp.css">
    <link rel="stylesheet" href="./groupedBarChartRating/styles_rating.css"> 
</head>

<body>
    <h2>Movie Count by Genre Over Time</h2>
    <div id="visualization">
        <div id="charts-column">
            <div id="chart-wrapper">
                <div id="chart-container"></div>
                
                <div id="bar-container">
                    <button id="close-bar-btn">← Back to Stream Graph</button>
                    <div id="bar-chart-inject"></div>
                </div>

                <div id="scatter-container" style="opacity:0; pointer-events:none;">
                    <button id="close-scatter-btn">← Back to Bar Chart</button>
                    <div id="scatter-chart-inject"></div>
                </div>
            </div>

            <div id="pcp-container">
                <svg id="pcp-chart"></svg>
            </div>
        </div>
        <div id="legend-container">
            <h4>Legend</h4>
            <div id="legend-items"></div>
        </div>
    </div>
    <div id="tooltip" class="tooltip"></div>
    <div id="pcp-tooltip" class="tooltip"></div>

    <script type="module" src="./streamGraph/stream.js"></script>
    <script type="module" src="./utils.js"></script>
</body>

</html>
